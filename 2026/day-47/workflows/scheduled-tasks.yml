name: Scheduled Tasks

on:
    schedule:
        # Every Monday at 2:30 AM UTC
        - cron: "30 2 * * 1"

        # Every 6 hours
        - cron: "0 */6 * * *"

    workflow_dispatch:


jobs:
    scheduled-job:
        runs-on: ubuntu-latest
        steps:
            - name: Print Execution Details
              run: |
                echo "Current UTC time: $(date -u)"
                echo "Runner: ${{ runner.os }}"
                echo "Repository: ${{ github.repository }}"
                echo "Event: ${{ github.event_name }}"

            - name: Print Trigger Details
              run: |
                if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
                  echo "Workflow was triggered manually"
                else
                  echo "Workflow was triggered by schedule"
                  echo "Cron: ${{ github.event.schedule }}"
                fi

            - name: Health Check
              run: |
                STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" https://www.trainwithshubham.com/)

                echo "HTTP Status: $STATUS"

                if [ "$STATUS" -ne 200 ]; then
                  echo "::error::Health check failed with HTTP status $STATUS"
                  exit 1
                fi

                echo "Health check passed"
                

#-L             follow redirects
#-s             silent
#-o /dev/null   discard response body
#-w             output selected response metadata
#%{http_code}   print HTTP status code

