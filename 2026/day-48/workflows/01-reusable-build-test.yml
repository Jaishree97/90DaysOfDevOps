name: Reusable Build and Test

# Called by another workflow
on:
  workflow_call:
    inputs:
      node_version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "22"

      run_tests:
        description: "Run application tests"
        required: false
        type: boolean
        default: true

    # Output returned to caller
    outputs:
      test_result:
        description: "Test result: passed or failed"
        value: ${{ jobs.build-test.outputs.test_result }}

jobs:
  build-test:
    name: Build & Test (Node ${{ inputs.node_version }})
    runs-on: ubuntu-latest

    # MongoDB service for testing
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    outputs:
      test_result: ${{ steps.set-result.outputs.test_result }}

    # Run commands inside app directory
    defaults:
      run:
        working-directory: task-manager-api

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: task-manager-api/package-lock.json

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Start application
      - name: Start application
        if: ${{ inputs.run_tests == true }}
        env:
          PORT: 3000
          MONGO_URI: mongodb://localhost:27017/taskmanager
        run: |
          node server.js &
          sleep 5

      # Run health check
      - name: Run tests
        if: ${{ inputs.run_tests == true }}
        id: run-tests
        run: |
          chmod +x tests/health-check.sh
          ./tests/health-check.sh

      # Set test result
      - name: Set test result
        id: set-result
        if: ${{ always() }}
        run: |
          if [[ "${{ inputs.run_tests }}" == "false" ]]; then
            echo "test_result=passed" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.run-tests.outcome }}" == "success" ]]; then
            echo "test_result=passed" >> "$GITHUB_OUTPUT"
          else
            echo "test_result=failed" >> "$GITHUB_OUTPUT"
          fi