---
# tasks file for roles/nginx
# 1. Install Nginx
- name: Install Nginx
  ansible.builtin.dnf:
    name: nginx
    state: present
  notify:
    - Restart Nginx
  tags:
    - nginx

# 2. Remove default Nginx site configuration
- name: Remove default Nginx site configuration
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  notify:
    - Reload Nginx
  tags:
    - nginx

# 3. Deploy main Nginx configuration
- name: Deploy main Nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload Nginx
  tags:
    - nginx

# 4. Deploy reverse proxy configuration
- name: Deploy reverse proxy configuration
  ansible.builtin.template:
    src: app-proxy.conf.j2
    dest: /etc/nginx/conf.d/app-proxy.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload Nginx
  tags:
    - nginx

# 5. Test Nginx configuration
- name: Test Nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false
  tags:
    - nginx

# 6. Start and enable Nginx
- name: Start and enable Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
  when: not ansible_check_mode
  tags:
    - nginx