name: Reusable Docker Build and Push

# Called by another workflow
on:
  workflow_call:
    inputs:
      image_name:
        description: "Docker image name"
        required: true
        type: string

      tag:
        description: "Docker image tag"
        required: true
        type: string

    # Docker Hub credentials
    secrets:
      docker_username:
        description: "Docker Hub username"
        required: true

      docker_token:
        description: "Docker Hub access token"
        required: true

    # Return image path to caller
    outputs:
      image_url:
        description: "Full Docker image path"
        value: ${{ jobs.docker-build-push.outputs.image_url }}

jobs:
  docker-build-push:
    name: Docker Build & Push (${{ inputs.tag }})
    runs-on: ubuntu-latest

    outputs:
      image_url: ${{ steps.set-image-url.outputs.image_url }}

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_token }}

      # Build and push Docker image
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./task-manager-api
          push: true
          tags: |
            ${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}
            ${{ secrets.docker_username }}/${{ inputs.image_name }}:latest

      # Set image URL output
      - name: Set image URL
        id: set-image-url
        run: |
          echo "image_url=${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}" >> "$GITHUB_OUTPUT"